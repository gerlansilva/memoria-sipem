<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Acervo dos trabalhos apresentados no Seminário Internacional de Pesquisa em Educação Matemática.">
  <title>Memória SIPEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="identity" href="#inicio" aria-label="Memória SIPEM — início">
      <img src="assets/logo-memoria-sipem.svg" alt="Memória SIPEM" width="290" height="70">
    </a>
    <a class="source-link" href="https://www.sbembrasil.org.br/eventos/index.php/sipem/issue/view/39" target="_blank" rel="noopener">Fonte oficial ↗</a>
  </header>

  <main id="inicio">
    <section class="catalog-intro" aria-labelledby="catalogo-titulo">
      <p class="edition"><img src="assets/logo-ix-sipem.png" alt="Logo do IX SIPEM"> IX SIPEM · Natal · 2024</p>
      <h1 id="catalogo-titulo">Trabalhos do IX SIPEM</h1>
      <p class="intro">Pesquise nos títulos, autorias, resumos e palavras-chave dos trabalhos.</p>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <span class="sr-only">Pesquisar no acervo</span>
        <input id="query" type="search" placeholder="Título, autoria, tema ou palavra-chave" autocomplete="off">
      </label>
      <div class="filters">
        <select id="gt" aria-label="Filtrar por Grupo de Trabalho"><option value="">Todos os GTs</option></select>
        <button id="clear" type="button">Limpar</button>
      </div>
    </section>

    <section class="catalog" aria-live="polite">
      <div class="result-head"><h2>Resultados</h2><span id="result-label"></span></div>
      <div id="results"></div>
    </section>
  </main>

  <footer><strong>Memória SIPEM</strong><span>Projeto independente de preservação e acesso aos Anais do SIPEM.</span></footer>
  <script src="data/records-ix-2024.js"></script>
  <script src="data/catalog.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
